name: Bug 报告
description: 报告可复现的问题；安全漏洞请勿使用此模板
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先删除 API Key、个人路径、图片内容和用户配置。安全问题请按 SECURITY.md 私密报告。
  - type: input
    id: version
    attributes:
      label: Vision MCP 版本
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
