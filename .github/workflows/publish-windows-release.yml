name: publish-windows-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (for example, 1.0.1)
        required: true
        type: string
      build_run_id:
        description: Successful build-windows workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release inputs
        env:
          VERSION: ${{ inputs.version }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$VERSION" = "$project_version"
          case "$VERSION" in
            *[!0-9.]*|.*|*.) exit 1 ;;
          esac
          build_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq .head_sha)"
          git merge-base --is-ancestor "$build_sha" "$GITHUB_SHA"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi
          echo "BUILD_SHA=$build_sha" >> "$GITHUB_ENV"
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: VisionMCP-Windows-unsigned
          path: release-assets
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify checksums and publish release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check "VisionMCP-Setup-$VERSION-x64.exe.sha256"
          gh release create "v$VERSION" \
            "VisionMCP-Setup-$VERSION-x64.exe" \
            "VisionMCP-Setup-$VERSION-x64.exe.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$BUILD_SHA" \
            --title "Vision MCP $VERSION" \
            --notes "Windows x64 安装器尚未进行代码签名；首次运行时 Windows 可能显示信誉提示。" \
            --generate-notes \
            --latest
