name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Check open-source release hygiene
        run: python scripts/release_check.py
      - name: Run tests
        run: python -m pytest
      - name: Check protocol from source
        run: python vision_server.py protocol-test
